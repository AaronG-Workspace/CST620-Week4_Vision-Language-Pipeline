# config.yaml : fixed before any results. data.py and make_synth.py read it.
# Changing anything after the first val run needs a dated entry in change_log.

seed: 42

models:
  grounding_dino: IDEA-Research/grounding-dino-tiny
  sam: facebook/sam-vit-base
  clip: openai/clip-vit-base-patch32
  num_threads: 8                      # set once after stage 1 timing, then never changed (thread count can shift float sums)
  sam_multimask_output: false
  clip_square_pad: true               # pad crops to square so CLIP's center crop can't cut off a dent or a label

splits:
  # Asset groups are split, not images. Proportions are by group count.
  val: 0.40
  test: 0.50
  showcase: 0.10
  allocation_tie_order: [test, val, showcase]   # who gets a group when largest remainders tie
  constraints:
    - every split gets at least one damaged-box group
    - every split gets at least one distractor group
    - backgrounds are split by the same proportions

dedup:
  phash_bits: 64
  phash_max_hamming: 8

images_per_split:
  val: 20
  test: 30
  showcase: 6

scene:
  canvas_long_side: 1024             # backgrounds resized so the long side is 1024 px
  cereal_boxes_per_image: [2, 4]
  distractors_per_image: [1, 2]
  damaged_share_of_cereal_boxes: 0.4  # exact quota per split, not a coin flip per box
  object_height_frac: [0.22, 0.38]   # of image height
  max_overlap_frac: 0.15
  min_visible_frac: 0.5              # placements below this are retried
  max_placement_tries: 50
  cap_at_available_groups: true      # a draw larger than the split's groups is capped and logged in counts.json
  max_upscale: 1.5                   # a cutout is never enlarged past this; a small source is placed smaller instead
  feather_radius_px: 2
  brightness_jitter: 0.10            # per paste, plus or minus

labels:
  per_image: [2, 3]
  width_frac_of_host: [0.30, 0.50]
  aspect: [1.4, 2.2]                 # width / height
  straight_deg: [0, 2]
  misaligned_deg: [8, 25]            # either direction
  misaligned_share: 0.5               # exact quota per split, not a coin flip per label
  font: C:/Windows/Fonts/arial.ttf
  palette: ["#ffffff", "#ffe066", "#d0f0c0", "#f4c2c2"]
  text_lines: [1, 3]
  word_list: data/raw/own/label_words.txt   # neutral words, never a prompt word

conditions:
  # Assigned per image by the seeded generator, balanced within each split.
  clean: {}
  typical: {gaussian_blur_sigma: 1.0, jpeg_quality: 70}
  hard: {brightness_scale: 0.6, motion_blur_px: 9, max_overlap_frac: 0.30}

cutouts:
  # cutouts.py reads this. Per-image processing only, nothing pooled across images.
  max_long_side: 1600              # downscale phone photos before masking
  method: backdrop_threshold
  border_frac: 0.03                # outer ring used to estimate this photo's backdrop color
  delta_e_threshold: 12            # Lab color distance from the backdrop that counts as product
  morph_kernel_px: 5
  erode_px: 1                      # trims backdrop fringe
  pad_px: 4
  fallback: rembg                  # used only when the threshold result fails QA; set none to disable
  rembg_model: u2net
  qa:
    fg_frac_range: [0.05, 0.90]
    min_largest_component_frac: 0.95
    min_solidity: 0.85             # mask area / convex hull area
    allow_border_touch: false

open_images:
  # Optional real-photo slice. Leave disabled unless you're ahead of schedule at build stage 9.
  enabled: false
  zoo_name: open-images-v7
  source_split: validation
  classes: [Box]
  max_samples: 80                  # pulled before filtering
  require_all_boxes_masked: true   # keep an image only if every Box in it has a mask
  drop_group_of: true              # drop images with any group-of Box
  target_images: 20
  split: {val: 0.5, test: 0.5}

tuning:
  # Fixed before any val results. tune_val.py reads this. Grids are [start, stop, step],
  # stop included, built from integer steps so floats don't drift.
  match_iou: 0.5                       # mask IoU that counts as a hit
  objective: macro_f1                  # mean F1 over the 3 categories, every wording averaged
  order: [dino_threshold, headline_wording, clip_temperature, clip_margin]   # one global threshold
  dino_threshold_grid: [0.10, 0.60, 0.05]
  dino_text_threshold: 0.25              # fixed: with one wording per call it only sets the label text, not which boxes are kept
  cache_floor: 0.05                    # queries whose best token score is below this aren't cached
  wording_candidates: [single, ensemble]
  ensemble: {method: union_nms, nms_iou: 0.5}
  clip_crop_pad_frac: 0.05
  temperature_grid: [0.50, 3.00, 0.05]
  margin_grid: [0.00, 0.50, 0.05]
  tie_break: fewer_false_positives     # higher threshold, higher margin; for wording, ensemble then list order
  ece_bins: 10

reporting:
  # Fixed before any val results. eval.py and metrics.py read this.
  wilson_z: 1.96
  bootstrap_resamples: 1000            # for F1 and mIoU intervals
  bootstrap_unit: image
  fp_localization_iou: 0.1             # an unmatched box overlapping ground truth between this and match_iou is a localization error
  top_confident_fp: 10
  overlay_max_side: 1024

change_log: []
